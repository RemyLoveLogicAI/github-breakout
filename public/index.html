<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Breakout — Turn your contribution graph into a game</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">
    <main class="flex-grow max-w-4xl mx-auto px-6 py-12 w-full">
      <h1 class="text-4xl font-extrabold mb-2 bg-gradient-to-r from-pink-500 to-violet-500 bg-clip-text text-transparent">
        GitHub Breakout
      </h1>
      <p class="text-slate-400 mb-8">
        Turn any GitHub contribution graph into an animated Breakout SVG.
      </p>

      <form id="form" class="space-y-4 bg-slate-900 p-6 rounded-2xl shadow-xl border border-slate-800">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-300 mb-1">GitHub username</label>
            <input id="username" type="text" placeholder="octocat" class="w-full rounded-lg bg-slate-950 border border-slate-700 px-3 py-2 focus:outline-none focus:border-violet-500" />
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-300 mb-1">Theme</label>
            <select id="theme" class="w-full rounded-lg bg-slate-950 border border-slate-700 px-3 py-2 focus:outline-none focus:border-violet-500">
              <option value="github_light">GitHub Light</option>
              <option value="github_dark">GitHub Dark</option>
              <option value="retro">Retro Neon</option>
              <option value="fire">Fire</option>
            </select>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <input id="ghost" type="checkbox" checked class="accent-violet-500" />
          <label for="ghost" class="text-sm text-slate-300">Ghost bricks (inactive days stay visible)</label>
        </div>

        <button type="submit" class="w-full bg-violet-600 hover:bg-violet-500 text-white font-semibold py-2.5 rounded-lg transition">
          Generate Breakout
        </button>
      </form>

      <div id="status" class="mt-6 text-center text-slate-400 hidden"></div>
      <div id="result" class="mt-8 flex justify-center hidden"></div>
    </main>

    <footer class="text-center text-slate-500 text-sm py-6">
      Powered by
      <a href="https://github.com/RemyLoveLogicAI/github-breakout" class="text-violet-400 hover:underline">github-breakout</a>
    </footer>

    <script>
      const themes = {
        github_light: "github_light",
        github_dark: "github_dark",
        retro: ["#2d1b4e", "#5b21b6", "#a855f7", "#22d3ee", "#f0abfc"],
        fire: ["#1a0505", "#7f1d1d", "#ea580c", "#facc15", "#ffffff"],
      };

      const form = document.getElementById("form");
      const status = document.getElementById("status");
      const result = document.getElementById("result");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const username = document.getElementById("username").value.trim();
        const theme = document.getElementById("theme").value;
        const ghost = document.getElementById("ghost").checked;

        if (!username) return;

        status.classList.remove("hidden");
        result.classList.add("hidden");
        status.textContent = "Simulating breakout…";

        const params = new URLSearchParams({ username, theme: typeof themes[theme] === "string" ? themes[theme] : "custom", ghost });
        if (Array.isArray(themes[theme])) {
          params.set("bricks", themes[theme].join(","));
        }

        try {
          const res = await fetch(`/api/breakout?${params.toString()}`);
          if (!res.ok) {
            const err = await res.json().catch(() => ({ error: "Unknown error" }));
            throw new Error(err.error || `HTTP ${res.status}`);
          }
          const svg = await res.text();
          result.innerHTML = svg;
          result.classList.remove("hidden");
          status.classList.add("hidden");
        } catch (err) {
          status.textContent = `Error: ${err.message}`;
          status.classList.remove("hidden");
        }
      });
    </script>
  </body>
</html>
